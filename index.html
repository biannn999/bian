 <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>PengetahuanKilat - Portal Informasi Umum</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <div class="logo">Pengetahuan<span>Kilat</span></div>
            <ul>
                <li><a href="#">Beranda</a></li>
                <li><a href="#">Edukasi</a></li>
                <li><a href="#">Teknologi</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <h1>Wawasan Luas dalam Satu Klik</h1>
        <p>Temukan informasi umum terpercaya mulai dari sejarah hingga sains.</p>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Cari topik...">
            <button onclick="searchFunction()">Cari</button>

    <main class="content" id="infoGrid">
        <div class="card">
            <h3>Sains & Alam</h3>
            
        </div>

            <h3>Sejarah Dunia</h3>
        </div>
        <div class="card">
            <h3>Teknologi</h3>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 InfoDunia. Dibuat dengan ❤️ untuk pembelajaran.</p>
    </footer>

    <script src="script.js"></script>

</html>
