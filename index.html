<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Background</title>
    <style>
        /* Reset and basic setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: borde-box;
        }

        body {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* The Galaxy Background Layer */
        .galaxy-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            
            /* Create the deep space gradient */
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
        }

        /* The Stars */
        .stars {
            width: 1px;
            height: 1px;
            background: transparent;
            box-shadow: 1744px 122px #FFF , 134px 1321px #FFF , 92px 859px #FFF , 1829px 1021px #FFF , 123px 45px #FFF , 1500px 1500px #FFF;
            animation: animStar 50s linear infinite;
        }

        /* Double the stars for more density */
        .stars2 {
            width: 2px;
            height: 2px;
            background: transparent;
            box-shadow: 1744px 122px #FFF , 134px 1321px #FFF , 92px 859px #FFF , 1829px 1021px #FFF , 123px 45px #FFF , 1500px 1500px #FFF;
            animation: animStar 100s linear infinite;
        }

        /* The Nebula/Glow effect */
        .nebula {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.4) 0%, rgba(0, 0, 0, 0) 70%);
            filter: blur(40px);
            animation: pulse 8s ease-in-out infinite alternate;
        }

        /* Content Card Styling */
        .content {
            position: relative;
            z-index: 10; /* Sits on top of the galaxy */
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
            color: white;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-width: 400px;
        }

        .content h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .content p {
            font-size: 1.1rem;
            color: #ddd;
        }

        /* Animations */
        @keyframes animStar {
            from { transform: translateY(0px); }
            to { transform: translateY(-2000px); }
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <!-- Background Elements -->
    <div class="galaxy-bg">
        <div class="stars"></div>
        <div class="stars2"></div>
        <div class="nebula"></div>
    </div>

    <!-- Foreground Content -->
    <div class="content">
        <h1>Deep Space</h1>
        <p>Welcome to the galaxy. This background is created entirely with CSS gradients and box-shadows.</p>
    </div>

</body>
</html>
